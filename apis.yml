aid: insforge
name: Insforge
description: >-
  InsForge is an open-source (Apache-2.0), agent-native cloud infrastructure
  platform built so that AI coding agents can provision and operate an entire
  backend end to end through a CLI and packaged agent skills instead of a human
  clicking through a dashboard. A single project bundles a Postgres database
  with schema management and row-level security, authentication (users,
  sessions, OAuth, JWT), S3-compatible object storage, Deno-based edge functions
  with cron, a unified AI model gateway, realtime subscriptions and webhooks,
  long-lived custom compute, frontend hosting via Vercel, transactional email,
  and payments via Stripe and Razorpay. The REST API is documented as fourteen
  OpenAPI 3.0 service specifications and is driven by an official TypeScript SDK,
  CLI, and hosted MCP server. InsForge is a Y Combinator company.
