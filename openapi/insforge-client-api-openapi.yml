        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        nextActions:
          type: string
          description: Suggested action to resolve the error
          example: Check your request parameters
    StoredFile:
      type: object
      properties:
        bucket:
          type: string
          example: avatars
          description: Name of the bucket containing the object
        key:
          type: string
          example: user123.jpg
          description: Unique key identifying the object within the bucket
        size:
          type: integer
          example: 102400
          description: Size of the file in bytes
        mimeType:
          type: string
          example: image/jpeg
          description: MIME type of the file
        uploadedAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
          description: ISO timestamp when the file was uploaded
        url:
          type: string
          example: /api/storage/buckets/avatars/objects/user123.jpg
          description: URL to download the file
      required:
      - bucket
      - key
      - size
      - uploadedAt
      - url
    OpenRouterImageMessage:
      type: object
      properties:
        type:
          type: string
          enum:
          - image_url
        image_url:
          type: object
          properties:
            url:
              type: string
              description: Can be a direct URL or data:image base64 URL
    FileParserPlugin:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Enable file parsing for PDFs in messages
        pdf:
          type: object
          properties:
            engine:
              type: string
              enum:
              - pdf-text
              - mistral-ocr
              - native
              description: 'PDF processing engine:

                - pdf-text: Best for well-structured PDFs with clear text content (Free)

                - mistral-ocr: Best for scanned documents or PDFs with images ($2 per 1,000 pages)

                - native: Only for models with native file support (charged as input tokens)

                If not specified, defaults to native if available, otherwise mistral-ocr

                '
