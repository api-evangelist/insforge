          description: Custom OAuth provider not found
  /api/auth/oauth/custom/{key}/callback:
    get:
      summary: Custom OAuth callback (GET)
      description: OAuth callback endpoint for custom OAuth providers
      tags:
      - Client
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: true
        schema:
          type: string
        description: Authorization code from the custom OAuth provider
      - name: state
        in: query
        required: true
        schema:
          type: string
        description: Signed OAuth state payload
      responses:
        '302':
          description: Redirect to application after custom OAuth completion
          headers:
            Location:
              schema:
                type: string
                format: uri
                description: Redirect URL with authentication parameters
  /api/auth/id-token:
    post:
      summary: Sign in with ID token (Google One Tap, native SDKs)
      description: 'Authenticate a user using an ID token obtained from a native SDK (e.g., Google One Tap).

        Currently only the `google` provider is supported.

        '
      tags:
      - Client
      parameters:
      - name: client_type
        in: query
        schema:
          type: string
          enum:
          - web
          - mobile
          - desktop
          - server
          default: web
        description: 'Client type determines how refresh tokens are returned:

          - web: Refresh token stored in httpOnly cookie, csrfToken returned in response

          - mobile/desktop/server: refreshToken returned directly in response body

          '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - provider
              - token
              properties:
                provider:
                  type: string
                  enum:
                  - google
                  description: Identity provider that issued the token
                token:
                  type: string
                  description: Raw ID token from the provider SDK
      responses:
        '200':
          description: Sign-in successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserResponse'
                  accessToken:
                    type: string
                  csrfToken:
                    type: string
                    nullable: true
                    description: CSRF token for use with refresh endpoint (web clients only)
                  refreshToken:
                    type: string
                    nullable: true
                    description: Refresh token for mobile/desktop/server clients (null for web clients)
        '400':
          description: Invalid request - unsupported provider or missing token
        '401':
          description: Invalid or expired ID token
