  /api/auth/oauth/{provider}/callback:
    get:
      summary: Provider-specific OAuth callback (GET)
      description: 'OAuth callback endpoint for provider-specific flows (most providers use GET).


        Response varies based on the original OAuth initiation:

        - With code_challenge (PKCE): Redirects with `insforge_code` for exchange endpoint

        - Without code_challenge (web): Redirects with `access_token` and sets httpOnly cookie

        '
      tags:
      - Client
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - github
          - discord
          - linkedin
          - facebook
          - instagram
          - tiktok
          - apple
          - x
          - spotify
          - microsoft
      - name: code
        in: query
        schema:
          type: string
        description: Authorization code from OAuth provider
      - name: state
        in: query
        required: true
        schema:
          type: string
        description: JWT state with redirect URI and optional code_challenge
      - name: token
        in: query
        schema:
          type: string
        description: Direct ID token (for some providers)
      responses:
        '302':
          description: 'Redirect to application.

            - PKCE flow: redirect_uri?insforge_code={code}&user_id={id}&email={email}&name={name}

            - Web flow: redirect_uri?access_token={token}&user_id={id}&email={email}&name={name}&csrf_token={csrf}

            '
          headers:
            Location:
              schema:
                type: string
                format: uri
                description: Redirect URL with authentication parameters
    post:
      summary: Provider-specific OAuth callback (POST)
      description: 'OAuth callback endpoint for providers that use POST (e.g., Apple with form_post response mode).


        Response varies based on the original OAuth initiation:

        - With code_challenge (PKCE): Redirects with `insforge_code` for exchange endpoint

        - Without code_challenge (web): Redirects with `access_token` and sets httpOnly cookie

        '
      tags:
      - Client
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - github
          - discord
          - linkedin
          - facebook
          - instagram
          - tiktok
          - apple
          - x
          - spotify
          - microsoft
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - state
              properties:
                code:
                  type: string
                  description: Authorization code from OAuth provider
                state:
                  type: string
                  description: JWT state with redirect URI and optional code_challenge
                id_token:
                  type: string
                  description: ID token (for Apple Sign In)
      responses:
        '302':
          description: 'Redirect to application.

            - PKCE flow: redirect_uri?insforge_code={code}&user_id={id}&email={email}&name={name}

            - Web flow: redirect_uri?access_token={token}&user_id={id}&email={email}&name={name}&csrf_token={csrf}

            '
          headers:
            Location:
              schema:
                type: string
                format: uri
                description: Redirect URL with authentication parameters
  /api/auth/oauth/custom/{key}:
    get:
      summary: Initiate custom OAuth flow (PKCE)
      description: Generate OAuth authorization URL for a configured custom OAuth provider using PKCE flow
      tags:
      - Client
      parameters:
      - name: key
        in: path
        required: true
        schema:
