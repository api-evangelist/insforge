                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
                    minLength: 1
            example:
              keys:
              - users/user123.jpg
              - users/user456.png
      responses:
        '200':
          description: Batch delete result
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                      - key
                      - status
                      properties:
                        key:
                          type: string
                        status:
                          type: string
                          enum:
                          - deleted
                          - notFound
                          - failed
                        message:
                          type: string
                          description: Present when status is failed.
              example:
                results:
                - key: users/user123.jpg
                  status: deleted
                - key: users/missing.png
                  status: notFound
                - key: users/locked.png
                  status: failed
                  message: Failed to delete object
        '400':
          description: Invalid bucket name or object keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_5'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_5'
  /api/storage/buckets/{bucketName}/upload-strategy:
    post:
      summary: Get Upload Strategy (Direct or Presigned URL)
      description: Returns upload strategy based on storage backend (S3 returns presigned URLs, local returns direct upload endpoints)
      tags:
      - Client
      security:
      - apiKey: []
      parameters:
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
        example: avatars
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - filename
              properties:
                filename:
                  type: string
                  description: Original filename for generating unique key
                  example: profile-photo.jpg
                contentType:
                  type: string
                  description: MIME type of the file
                  example: image/jpeg
                size:
                  type: integer
                  description: File size in bytes
                  example: 102400
      responses:
        '200':
          description: Upload strategy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStrategy'
              examples:
                s3:
                  summary: S3 Backend Response
                  value:
                    method: presigned
                    uploadUrl: https://s3-bucket.amazonaws.com/
                    fields:
                      bucket: my-s3-bucket
                      key: app-key/avatars/profile-photo-1234567890-abc123.jpg
                      X-Amz-Algorithm: AWS4-HMAC-SHA256
                      X-Amz-Credential: AKIA.../20250905/us-east-2/s3/aws4_request
                      X-Amz-Date: 20250905T000000Z
                      Policy: eyJ...
                      X-Amz-Signature: abc123...
                    key: profile-photo-1234567890-abc123.jpg
                    confirmRequired: true
                    confirmUrl: /api/storage/buckets/avatars/objects/profile-photo-1234567890-abc123.jpg/confirm-upload
                    expiresAt: '2025-09-05T01:00:00Z'
                local:
                  summary: Local Storage Response
                  value:
                    method: direct
                    uploadUrl: /api/storage/buckets/avatars/objects/profile-photo-1234567890-abc123.jpg
                    key: profile-photo-1234567890-abc123.jpg
                    confirmRequired: false
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_5'
  /api/storage/buckets/{bucketName}/objects/{objectKey}:
    put:
      summary: Upload Object
      tags:
      - Client
      security:
      - apiKey: []
      parameters:
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
        example: avatars
      - name: objectKey
        in: path
        required: true
        schema:
          type: string
        example: user123.jpg
        description: Object key (can include forward slashes for pseudo-folders)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
              required:
              - file
      responses:
        '201':
          description: Object uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
              example:
                bucket: avatars
                key: user123.jpg
                size: 102400
                mimeType: image/jpeg
                uploadedAt: '2024-01-21T10:30:00Z'
                url: /api/storage/buckets/avatars/objects/user123.jpg
        '400':
          description: Invalid bucket name, key, or file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_5'
              example:
                error: INVALID_FILE
                message: No file provided in the request
                statusCode: 400
                nextActions: Include a file in the multipart form data
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_5'
              example:
                error: BUCKET_NOT_FOUND
                message: Bucket 'nonexistent' does not exist
                statusCode: 404
                nextActions: Create the bucket first
    get:
      summary: Download Object
      tags:
      - Client
      security:
      - apiKey: []
      parameters:
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
        example: avatars
      - name: key
        in: path
        required: true
        schema:
          type: string
        example: user123.jpg
      responses:
        '200':
          description: File content
          content:
            '*/*':
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              schema:
                type: string
              description: MIME type of the file
            Content-Length:
              schema:
                type: integer
              description: Size of the file in bytes
        '404':
          description: Object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_5'
              example:
                error: OBJECT_NOT_FOUND
                message: Object 'user123.jpg' not found in bucket 'avatars'
                statusCode: 404
                nextActions: Check the bucket and key combination
    delete:
      summary: Delete Object
      tags:
      - Client
      security:
      - apiKey: []
      parameters:
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
        example: avatars
      - name: key
        in: path
        required: true
        schema:
          type: string
        example: user123.jpg
      responses:
        '200':
          description: Object deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Object deleted successfully
        '404':
          description: Object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_5'
              example:
                error: OBJECT_NOT_FOUND
                message: Object 'user123.jpg' not found in bucket 'avatars'
                statusCode: 404
                nextActions: Check the bucket and key combination
  /api/storage/buckets/{bucketName}/objects/{objectKey}/confirm-upload:
    post:
      summary: Confirm Presigned Upload
      description: Confirms that a file was successfully uploaded to S3 using presigned URL
      tags:
      - Client
      security:
      - apiKey: []
      parameters:
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
        example: avatars
      - name: objectKey
        in: path
        required: true
        schema:
          type: string
        example: profile-photo-1234567890-abc123.jpg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - size
              properties:
                size:
                  type: integer
                  description: File size in bytes
                  example: 102400
                contentType:
                  type: string
                  description: MIME type of the file
                  example: image/jpeg
                etag:
                  type: string
                  description: S3 ETag of the uploaded object (optional)
                  example: 9bb58f26192e4ba00f01e2e7b136bbd8
      responses:
        '201':
          description: Upload confirmed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '404':
          description: Upload not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_5'
              example:
                error: UPLOAD_NOT_FOUND
                message: Upload not found for key 'profile-photo.jpg' in bucket 'avatars'
                statusCode: 404
        '409':
          description: Already confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_5'
              example:
                error: ALREADY_CONFIRMED
                message: File 'profile-photo.jpg' already confirmed in bucket 'avatars'
                statusCode: 409
  /api/storage/buckets/{bucketName}/download-strategy/objects/{objectKey}:
    get:
      summary: Get Download Strategy (Direct or Presigned URL)
      description: 'Returns download strategy based on storage backend and bucket visibility.

        - S3 with public bucket: Direct URLs (no presigning, better performance)

        - S3 with private bucket: Presigned URLs with expiration

        - Local storage: Always direct endpoints


        Expiry (when presigned) is auto-calculated server-side from bucket

        visibility; no request body is accepted.


        Object keys may contain `/` (pseudo-folders); the path is matched

        with a wildcard, so callers should NOT percent-encode `/` inside

        `objectKey`.

        '
      tags:
      - Client
      security:
      - apiKey: []
      parameters:
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
        example: avatars
      - name: objectKey
        in: path
        required: true
        schema:
          type: string
        example: profile-photo.jpg
      responses:
        '200':
          description: Download strategy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadStrategy'
              examples:
                s3-public:
                  summary: S3 Public Bucket Response
                  value:
                    method: direct
                    url: https://s3-bucket.s3.us-east-2.amazonaws.com/app-key/public-assets/logo.png
                s3-private:
                  summary: S3 Private Bucket Response
                  value:
                    method: presigned
                    url: https://s3-bucket.s3.us-east-2.amazonaws.com/app-key/avatars/profile.jpg?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=...
                    expiresAt: '2025-09-05T01:00:00Z'
                local:
                  summary: Local Storage Response
                  value:
                    method: direct
                    url: /api/storage/buckets/avatars/objects/profile-photo.jpg
        '404':
          description: Object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_5'
  /api/storage/buckets/{bucketName}/objects/{objectKey}/download-strategy:
    post:
      deprecated: true
      summary: Get Download Strategy (Deprecated — use GET on the canonical path)
      description: 'Deprecated alias of

        `GET /api/storage/buckets/{bucketName}/download-strategy/objects/{objectKey}`.

        Retained at the original path/method for backward compatibility with

        SDK releases that already shipped against this POST endpoint. Any

        request body is ignored.

        '
      tags:
      - Client
      security:
      - apiKey: []
      parameters:
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
        example: avatars
      - name: objectKey
        in: path
        required: true
        schema:
          type: string
        example: profile-photo.jpg
      responses:
        '200':
          description: Download strategy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadStrategy'
        '404':
          description: Object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_5'
components:
  schemas:
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        profile:
          type: object
          nullable: true
          additionalProperties: true
          description: User profile data (name, avatar_url, and custom fields)
          properties:
            name:
              type: string
            avatar_url:
              type: string
              format: uri
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: System metadata (device ID, login IP, etc.)
        emailVerified:
          type: boolean
        providers:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChatRequest:
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
          description: OpenRouter model identifier
          example: openai/gpt-4
        messages:
          type: array
          description: Array of messages for conversation (supports text, images, audio, and files/PDFs)
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
          description: Enable streaming response via Server-Sent Events
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: Controls randomness in generation
        maxTokens:
          type: integer
          description: Maximum number of tokens to generate
        topP:
          type: number
          minimum: 0
          maximum: 1
          description: Nucleus sampling parameter
        webSearch:
          $ref: '#/components/schemas/WebSearchPlugin'
        fileParser:
          $ref: '#/components/schemas/FileParserPlugin'
        thinking:
          type: boolean
          description: Enable extended reasoning capabilities (appends :thinking to model ID if not already present). Not every model supports this, only works with Anthropic models with the :thinking suffix.
        tools:
          type: array
          description: Tool definitions for function calling
          items:
            $ref: '#/components/schemas/Tool'
        toolChoice:
          description: 'Controls tool usage: auto, none, required, or a specific function'
          oneOf:
          - type: string
            enum:
            - auto
            - none
            - required
          - type: object
            required:
            - type
            - function
            properties:
              type:
                type: string
                enum:
                - function
              function:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
        parallelToolCalls:
          type: boolean
          description: Allow the model to call multiple tools in parallel
    FunctionDefinition:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the function to call
        description:
          type: string
          description: A description of what the function does
        parameters:
          type: object
          description: JSON Schema describing the function parameters
    EmbeddingObject:
      type: object
      properties:
        object:
          type: string
          enum:
          - embedding
          description: Object type, always "embedding"
        embedding:
          type: array
          items:
            type: number
          description: The embedding vector (array of floats)
        index:
          type: integer
          description: Index of this embedding in the input array
    ImageGenerationOptions:
      type: object
      required:
      - model
      - prompt
      properties:
        model:
          type: string
          description: OpenRouter model identifier for image generation
          example: openai/dall-e-3
        prompt:
          type: string
          description: Text prompt describing the desired image
          example: A serene landscape with mountains and a lake at sunset
    WebSearchPlugin:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Enable web search integration
        engine:
          type: string
          enum:
          - native
          - exa
          description: 'Search engine selection:

            - native: Use provider''s built-in web search (OpenAI, Anthropic, Perplexity, xAI)

            - exa: Use Exa''s search API

            - undefined: Auto-select (native if available, otherwise Exa)

            '
        maxResults:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: Maximum number of search results to include
        searchPrompt:
          type: string
          description: Custom prompt for attaching search results to the message
    EmbeddingsResponse:
      type: object
      properties:
        object:
          type: string
          enum:
          - list
          description: Object type, always "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingObject'
        metadata:
          type: object
          properties:
            model:
              type: string
              description: The model used for embedding
              example: text-embedding-ada-002
            usage:
              $ref: '#/components/schemas/TokenUsage'
    ProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User ID
        profile:
          type: object
          nullable: true
          additionalProperties: true
          description: User profile data (can contain custom fields)
          properties:
            name:
              type: string
            avatar_url:
              type: string
              format: uri
    ChatCompletionResponse:
      type: object
      properties:
        text:
          type: string
          description: AI model response content
        tool_calls:
          type: array
          description: Tool calls requested by the model (present when the model invokes tools)
          items:
            $ref: '#/components/schemas/ToolCall'
        annotations:
          type: array
          description: URL citations from web search results (present when webSearch is enabled)
          items:
            $ref: '#/components/schemas/UrlCitationAnnotation'
        metadata:
          type: object
          properties:
            model:
              type: string
            usage:
              $ref: '#/components/schemas/TokenUsage'
    Tool:
      type: object
      required:
      - type
      - function
      properties:
        type:
          type: string
          enum:
          - function
        function:
          $ref: '#/components/schemas/FunctionDefinition'
    SendRawEmailRequest:
      type: object
      required:
      - to
      - subject
      - html
      properties:
        to:
          oneOf:
          - type: string
            format: email
            description: Single recipient email address
            example: user@example.com
          - type: array
            items:
              type: string
              format: email
            minItems: 1
            maxItems: 50
            description: Multiple recipient email addresses (max 50)
            example:
            - user1@example.com
            - user2@example.com
          description: Recipient email address(es) - maximum 50 recipients
        subject:
          type: string
          minLength: 1
          maxLength: 500
          description: Email subject line
          example: Welcome to our platform
        html:
          type: string
          minLength: 1
          description: HTML content of the email body
          example: <h1>Welcome!</h1><p>Thank you for joining us.</p>
        cc:
          oneOf:
          - type: string
            format: email
            description: Single CC recipient email address
          - type: array
            items:
              type: string
              format: email
            minItems: 1
            maxItems: 50
            description: Multiple CC recipient email addresses (max 50)
          description: Carbon copy recipient(s) - maximum 50 recipients
        bcc:
          oneOf:
          - type: string
            format: email
            description: Single BCC recipient email address
          - type: array
            items:
              type: string
              format: email
            minItems: 1
            maxItems: 50
            description: Multiple BCC recipient email addresses (max 50)
          description: Blind carbon copy recipient(s) - maximum 50 recipients
        from:
          type: string
          maxLength: 100
          description: Custom sender name (uses default if not provided)
          example: My App
        replyTo:
          type: string
          format: email
          description: Reply-to email address
          example: support@example.com
    SendEmailResponse:
      type: object
      description: Empty object on success - extend with optional fields later if needed
    DownloadStrategy:
      type: object
      required:
      - method
      - url
      properties:
        method:
          type: string
          enum:
          - presigned
          - direct
          description: 'Download method:

            - `direct`: Direct URL access (S3 public buckets or local storage)

            - `presigned`: Secure URL with signature and expiration (S3 private buckets)

            '
          example: direct
        url:
          type: string
          description: URL to download the file from
          example: https://s3-bucket.s3.us-east-2.amazonaws.com/app-key/public-assets/logo.png
        expiresAt:
          type: string
          format: date-time
          description: Expiration time for presigned URLs (only present when method is 'presigned')
          example: '2025-09-05T01:00:00Z'
        headers:
          type: object
          description: Optional headers to include in the download request
          additionalProperties: true
    TokenUsage:
      type: object
      properties:
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        totalTokens:
          type: integer
    ToolCall:
      type: object
      required:
      - id
      - type
      - function
      properties:
        id:
          type: string
          description: Unique identifier for this tool call
        type:
          type: string
          enum:
          - function
        function:
          type: object
          required:
          - name
          - arguments
          properties:
            name:
              type: string
              description: The name of the function called
            arguments:
              type: string
              description: JSON string of the function arguments
    ChatMessage:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          - system
          - tool
          description: Role of the message sender
        content:
          type: string
          nullable: true
          description: Message content (nullable for assistant messages with tool_calls)
        tool_calls:
          type: array
          description: Tool calls made by the assistant (assistant messages only)
          items:
            $ref: '#/components/schemas/ToolCall'
        tool_call_id:
          type: string
          description: ID of the tool call being responded to (tool messages only)
    UrlCitationAnnotation:
      type: object
      properties:
        type:
          type: string
          enum:
          - url_citation
        urlCitation:
          type: object
          properties:
            url:
              type: string
              description: URL of the cited source
            title:
              type: string
              description: Title of the cited page
            content:
              type: string
              description: Relevant content snippet from the source
            startIndex:
              type: integer
              description: Start character index in response text where citation applies
            endIndex:
              type: integer
              description: End character index in response text where citation applies
    UploadStrategy:
      type: object
      required:
      - method
      - uploadUrl
      - key
      - confirmRequired
      properties:
        method:
          type: string
          enum:
          - presigned
          - direct
          description: Upload method - presigned for S3, direct for local storage
          example: presigned
        uploadUrl:
          type: string
          description: URL to upload the file to
          example: https://s3-bucket.amazonaws.com/
        fields:
          type: object
          description: Form fields for presigned POST (S3 only)
          additionalProperties: true
          example:
            bucket: my-s3-bucket
            key: app-key/avatars/profile.jpg
            X-Amz-Algorithm: AWS4-HMAC-SHA256
        key:
          type: string
          description: Generated unique key for the file
          example: profile-photo-1234567890-abc123.jpg
        confirmRequired:
          type: boolean
          description: Whether upload confirmation is required
          example: true
        confirmUrl:
          type: string
          description: URL to confirm the upload (if confirmRequired is true)
          example: /api/storage/buckets/avatars/objects/profile.jpg/confirm-upload
        expiresAt:
          type: string
          format: date-time
          description: Expiration time for presigned URL (S3 only)
          example: '2025-09-05T01:00:00Z'
    ProjectAdminResponse:
      type: object
      required:
      - subject
      - username
      properties:
        subject:
          type: string
          example: local:admin
        username:
          type: string
          example: admin
    ErrorResponse_3:
      type: object
      properties:
        error:
          type: string
          description: Error message
        details:
          oneOf:
          - type: string
          - type: array
            items:
              type: object
          - type: object
          description: Additional error details
        message:
          type: string
          description: Detailed error message
        pattern:
          type: string
          description: Pattern that caused validation failure (for dangerous code detection)
    ErrorResponse:
      type: object
      required:
      - error
      - message
      - statusCode
      properties:
        error:
          type: string
          description: Error code for programmatic handling
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message
          example: Email is already in use
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        nextActions:
          type: string
          description: Suggested action to resolve the error
          example: Please use a different email address
    ErrorResponse_4:
      type: object
      required:
      - error
      - message
      - statusCode
      properties:
        error:
          type: string
          description: Error code for programmatic handling
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message
          example: Invalid input data
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        nextActions:
          type: string
          description: Suggested action to resolve the error
          example: Check the request body format
    EmbeddingsRequest:
      type: object
      required:
      - model
      - input
      properties:
        model:
          type: string
          description: Embedding model identifier
          example: google/gemini-embedding-001
        input:
          oneOf:
          - type: string
            description: Single text input to embed
          - type: array
            items:
              type: string
            description: Array of text inputs to embed
          example: Hello world
        encoding_format:
          type: string
          enum:
          - float
          - base64
          default: float
          description: The format to return the embeddings in. Can be either float or base64.
        dimensions:
          type: integer
          minimum: 0
          description: The number of dimensions the resulting output embeddings should have. Only supported in certain models.
    ErrorResponse_5:
      type: object
      required:
      - error
      - message
      - statusCode
      properties:
        error:
          type: string
          description: Error code for programmatic handling
          example: VALIDATION_ERROR
        message:
          type: string
