          type: string
          nullable: true
        installCommand:
          type: string
          nullable: true
        devCommand:
          type: string
          nullable: true
        rootDirectory:
          type: string
          nullable: true
    ErrorResponse_7:
      type: object
      required:
      - error
      - message
      - statusCode
      properties:
        error:
          type: string
          description: Error code for programmatic handling
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message
          example: Invalid request
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        nextActions:
          type: string
          description: Suggested action to resolve the error
          example: Check your request parameters
    DeploymentManifestFile:
      allOf:
      - $ref: '#/components/schemas/DeploymentManifestFileEntry'
      - type: object
        required:
        - fileId
        - uploadedAt
        properties:
          fileId:
            type: string
            format: uuid
          uploadedAt:
            type: string
            format: date-time
            nullable: true
    FunctionMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the function
        slug:
          type: string
          description: URL-friendly identifier
          example: hello-world
        name:
          type: string
          description: Display name for the function
          example: Hello World Function
        description:
          type: string
          nullable: true
          description: Description of what the function does
        status:
          type: string
          enum:
          - draft
          - active
          - error
          description: Current status of the function
        created_at:
          type: string
          format: date-time
          description: When the function was created
        updated_at:
          type: string
          format: date-time
          description: When the function was last updated
        deployed_at:
          type: string
          format: date-time
          nullable: true
          description: When the function was last deployed (null if never deployed)
