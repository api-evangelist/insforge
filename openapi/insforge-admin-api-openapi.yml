        message:
          type: string
          description: Human-readable error message
          example: Invalid input data
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        nextActions:
          type: string
          description: Suggested action to resolve the error
          example: Check the request body format
    StoredFile:
      type: object
      properties:
        bucket:
          type: string
          example: avatars
          description: Name of the bucket containing the object
        key:
          type: string
          example: user123.jpg
          description: Unique key identifying the object within the bucket
        size:
          type: integer
          example: 102400
          description: Size of the file in bytes
        mimeType:
          type: string
          example: image/jpeg
          description: MIME type of the file
        uploadedAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
          description: ISO timestamp when the file was uploaded
        url:
          type: string
          example: /api/storage/buckets/avatars/objects/user123.jpg
          description: URL to download the file
      required:
      - bucket
      - key
      - size
      - uploadedAt
      - url
    CreateDeploymentResponse:
      type: object
      required:
      - id
      - uploadUrl
      - uploadFields
      properties:
        id:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        uploadFields:
          type: object
          additionalProperties:
            type: string
    Migration:
      type: object
      required:
      - version
      - name
      - statements
      - createdAt
      properties:
        version:
          type: string
          pattern: ^\d{1,64}$
        name:
          type: string
        statements:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    DeploymentManifestFileEntry:
      type: object
      required:
      - path
      - sha
      - size
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 2048
          description: Relative source path using forward slashes.
          example: src/App.tsx
        sha:
          type: string
          pattern: ^[a-fA-F0-9]{40}$
          description: SHA-1 hex digest of the file content.
        size:
          type: integer
          minimum: 0
          description: File size in bytes.
    CreateDirectDeploymentRequest:
      type: object
      required:
      - files
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 5000
          description: Source file manifest. The default backend limit is 5000 files.
          items:
            $ref: '#/components/schemas/DeploymentManifestFileEntry'
    ErrorResponse_2:
      type: object
      required:
      - error
      - message
      - statusCode
      properties:
        error:
          type: string
          description: Error code for programmatic handling.
        message:
          type: string
          description: Human-readable error message.
        statusCode:
          type: integer
        nextActions:
          type: string
          description: Suggested action to resolve the error.
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse_2'
    DeploymentList:
      description: Deployment runs
      headers:
        Content-Range:
          schema:
            type: string
          description: Range of deployment records returned, for example `0-49/125`.
        Preference-Applied:
          schema:
            type: string
          description: Count preference applied by the backend.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Deployment'
  parameters:
    DeploymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Deployment run ID.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of deployments to skip.
    AIProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum:
        - openrouter
      description: AI provider identifier
    EnvVarId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Provider environment variable ID.
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Direct upload file ID returned by `POST /api/deployments/direct`.
    Domain:
      name: domain
      in: path
      required: true
      schema:
        type: string
        pattern: ^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$
      description: User-owned custom domain.
      example: app.example.com
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 50
      description: Maximum number of deployments to return.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
