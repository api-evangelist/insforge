      - verified
      - misconfigured
      - verification
      - cnameTarget
      - aRecordValue
      properties:
        domain:
          type: string
          example: app.example.com
        apexDomain:
          type: string
          example: example.com
        verified:
          type: boolean
        misconfigured:
          type: boolean
        verification:
          type: array
          items:
            $ref: '#/components/schemas/DomainVerificationRecord'
        cnameTarget:
          type: string
          nullable: true
        aRecordValue:
          type: string
          nullable: true
    StorageConfig:
      type: object
      required:
      - id
      - maxFileSizeMb
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        maxFileSizeMb:
          type: integer
          minimum: 1
          maximum: 200
          description: Maximum file upload size in megabytes
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectSettings:
      type: object
      properties:
