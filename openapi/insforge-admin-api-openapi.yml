      - id
      - key
      - isActive
      - isReserved
      - createdAt
      - updatedAt
    ErrorResponse_4:
      type: object
      required:
      - error
      - message
      - statusCode
      properties:
        error:
          type: string
          description: Error code for programmatic handling
        message:
          type: string
          description: Human-readable error message
        statusCode:
          type: integer
          description: HTTP status code
        nextAction:
          type: string
          description: Suggested action to resolve the error
    ErrorResponse_5:
      type: object
      required:
      - error
