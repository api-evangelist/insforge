              - tableName
              - columns
              properties:
                tableName:
                  type: string
                columns:
                  type: array
                  items:
                    type: object
                    required:
                    - name
                    - type
                    - nullable
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum:
                        - string
                        - datetime
                        - integer
