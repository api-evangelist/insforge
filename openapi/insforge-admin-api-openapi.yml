        url:
          type: string
          nullable: true
          example: https://my-app.vercel.app
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CustomDomain:
      type: object
      required:
