        example: avatars
      - name: prefix
        in: query
        required: false
        schema:
          type: string
        description: Filter objects by key prefix
        example: users/
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Search objects by key (partial match)
        example: profile
      responses:
        '200':
          description: List of objects in bucket
