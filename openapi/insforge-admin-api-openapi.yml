      - value
      properties:
        key:
          type: string
        value:
          type: string
    ErrorResponse_3:
      type: object
      properties:
        error:
          type: string
          description: Error message
        details:
          oneOf:
          - type: string
          - type: array
            items:
              type: object
          - type: object
          description: Additional error details
        message:
          type: string
          description: Detailed error message
        pattern:
          type: string
          description: Pattern that caused validation failure (for dangerous code detection)
    AddCustomDomainRequest:
      type: object
      required:
