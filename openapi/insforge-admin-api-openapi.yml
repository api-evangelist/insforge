          description: Failed to list functions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
    post:
      summary: Create new function
      description: Create a new function with code that runs in Deno runtime
      tags:
      - Admin
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - code
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Display name for the function
                  example: Hello World Function
                slug:
                  type: string
                  pattern: ^[a-zA-Z0-9_-]+$
                  description: URL-friendly identifier (auto-generated from name if not provided)
                  example: hello-world
                code:
                  type: string
                  minLength: 1
                  description: JavaScript/TypeScript code that exports an async function
                  example: "export default async function(request) {\n  const { name = 'World' } = await request.json();\n  return new Response(\n    JSON.stringify({ message: `Hello, ${name}!` }),\n    { headers: { 'Content-Type': 'application/json' } }\n  );\n}\n"
                description:
                  type: string
                  description: Description of what the function does
                  example: Returns a personalized greeting message
                status:
                  type: string
                  enum:
                  - draft
                  - active
                  default: active
                  description: Initial status (draft or active/deployed)
      responses:
        '201':
          description: Function created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  function:
                    $ref: '#/components/schemas/FunctionMetadata'
              example:
                success: true
                function:
                  id: 123e4567-e89b-12d3-a456-426614174000
                  slug: hello-world
                  name: Hello World Function
                  description: Returns a greeting message
                  status: active
                  created_at: '2024-01-21T10:30:00Z'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
              examples:
                validation:
                  value:
                    error: Invalid request
                    details:
                    - code: too_small
                      minimum: 1
                      path:
                      - name
                      message: Name is required
                dangerousCode:
                  value:
                    error: Code contains potentially dangerous patterns
                    pattern: /Deno\.run/i
        '409':
          description: Function slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
              example:
                error: Function with this slug already exists
                details: duplicate key value violates unique constraint
        '500':
          description: Failed to create function
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_3'
