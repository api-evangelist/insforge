              type: number
            usageWeekly:
              type: number
            usageMonthly:
              type: number
            isFreeTier:
              type: boolean
            observabilityAvailable:
              type: boolean
            observabilityError:
              type: string
        charts:
          type: object
          properties:
            spend:
              type: array
              items:
                $ref: '#/components/schemas/AIOverviewMetricPoint'
            requests:
              type: array
              items:
                $ref: '#/components/schemas/AIOverviewMetricPoint'
            tokens:
              type: array
              items:
                $ref: '#/components/schemas/AIOverviewMetricPoint'
    ErrorResponse:
      type: object
      required:
      - error
      - message
      - statusCode
      properties:
        error:
          type: string
          description: Error code for programmatic handling
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message
          example: Email is already in use
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        nextActions:
          type: string
          description: Suggested action to resolve the error
          example: Please use a different email address
    DeploymentEnvVarWithValue:
      allOf:
      - $ref: '#/components/schemas/DeploymentEnvVar'
      - type: object
        required:
        - value
